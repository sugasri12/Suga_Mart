<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SUGA MART - Admin Forgot Password</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .brand,
        .brand:hover,
        .brand:focus,
        .brand:active {
            text-decoration: none;
        }

        .brand h1,
        .brand p,
        .brand span {
            text-decoration: none;
        }

    </style>

</head>


<body class="admin-forgot-password-page">


    <!-- ================================
         HEADER
         ================================ -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
        >

            <span class="brand-mark">
                S
            </span>

            <span class="brand-text">

                <h1>
                    SUGA MART
                </h1>

                <span>
                    FURNITURE MARKETPLACE
                </span>

            </span>

        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- ================================
         MAIN
         ================================ -->

    <main class="auth-main">

        <section class="auth-card">


            <div class="auth-header">

                <p class="eyebrow">
                    ADMIN PORTAL
                </p>

                <h2>
                    Forgot <span>Password?</span>
                </h2>

                <p>
                    Enter your admin email address to
                    reset your password.
                </p>

            </div>


            <!-- ================================
                 FORGOT PASSWORD FORM
                 ================================ -->

            <form
                id="adminForgotPasswordForm"
                class="auth-form"
            >


                <div class="form-group">

                    <label for="adminForgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminForgotEmail"
                        placeholder="Enter your admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Reset Password
                </button>

            </form>


            <!-- ================================
                 MESSAGE
                 ================================ -->

            <p
                id="adminForgotPasswordMessage"
                class="form-message"
            ></p>


            <!-- ================================
                 LOGIN LINK
                 ================================ -->

            <div class="auth-footer-text">

                <p>
                    Remember your password?
                </p>

                <a href="admin-login.html">
                    Back to Login
                </a>

            </div>


            <!-- ================================
                 BACK TO HOME
                 ================================ -->

            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer class="site-footer">

        <p>

            &copy; 2026 SUGA MART

            <span>·</span>

            Furniture Marketplace

        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
