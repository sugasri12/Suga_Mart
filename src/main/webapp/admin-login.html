<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SUGA MART - Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* Remove underline from SUGA MART brand */

        .brand,
        .brand:hover,
        .brand:focus,
        .brand:active {
            text-decoration: none;
        }

        .brand h1,
        .brand p,
        .brand span {
            text-decoration: none;
        }


        /* Password field */

        .password-field {
            position: relative;
        }


        /* Show Password */

        .show-password {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 9px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: #777267;

            cursor: pointer;

            user-select: none;
        }

        .show-password input {
            width: 15px;

            height: 15px;

            margin: 0;

            accent-color: #176b52;

            cursor: pointer;
        }

    </style>

</head>


<body class="admin-login-page">


    <!-- ================================
         HEADER
         ================================ -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
        >

            <span class="brand-mark">
                S
            </span>

            <span class="brand-text">

                <h1>
                    SUGA MART
                </h1>

                <span>
                    FURNITURE MARKETPLACE
                </span>

            </span>

        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- ================================
         MAIN
         ================================ -->

    <main class="auth-main">

        <section class="auth-card">


            <div class="auth-header">

                <p class="eyebrow">
                    ADMIN PORTAL
                </p>

                <h2>
                    Admin Login
                </h2>

                <p>
                    Login to manage the SUGA MART
                    furniture marketplace.
                </p>

            </div>


            <!-- ================================
                 LOGIN FORM
                 ================================ -->

            <form
                id="adminLoginForm"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group password-field">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <label class="show-password">

                        <input
                            type="checkbox"
                            id="showAdminPassword"
                        >

                        <span>
                            Show Password
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>


            <!-- ================================
                 LOGIN MESSAGE
                 ================================ -->

            <p
                id="adminLoginMessage"
                class="form-message"
            ></p>


            <!-- ================================
                 FORGOT PASSWORD
                 ================================ -->

            <div class="auth-link">

                <a href="admin-forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- ================================
                 CREATE ACCOUNT
                 ================================ -->

            <div class="auth-footer-text">

                <p>
                    Don't have an admin account?
                </p>

                <a href="admin-create-account.html">
                    Create Account
                </a>

            </div>


            <!-- ================================
                 BACK TO HOME
                 ================================ -->

            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer class="site-footer">

        <p>

            &copy; 2026 SUGA MART

            <span>·</span>

            Furniture Marketplace

        </p>

    </footer>


    <!-- ================================
         SHOW PASSWORD
         ================================ -->

    <script>

        const showAdminPassword =
            document.getElementById("showAdminPassword");

        const adminPassword =
            document.getElementById("adminPassword");


        showAdminPassword.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    adminPassword.type = "text";

                } else {

                    adminPassword.type = "password";

                }

            }
        );

    </script>


    <script src="script.js"></script>

</body>

</html>
