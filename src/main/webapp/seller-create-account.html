<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUGA MART - Seller Create Account</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Remove underline from SUGA MART brand */
        .brand,
        .brand:hover,
        .brand:focus,
        .brand:active {
            text-decoration: none;
        }

        .brand h1,
        .brand p,
        .brand span {
            text-decoration: none;
        }

        /* Password fields */
        .password-field {
            position: relative;
        }

        /* Show Password */
        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 9px;

            font-family: Arial, sans-serif;
            font-size: 12px;

            color: #777267;

            cursor: pointer;
            user-select: none;
        }

        .show-password input {
            width: 15px;
            height: 15px;

            margin: 0;

            accent-color: #176b52;

            cursor: pointer;
        }
    </style>
</head>


<body class="seller-create-account-page">

    <!-- ================================
         HEADER
         ================================ -->

    <header class="site-header">

        <div class="brand">

            <h1>SUGA MART</h1>

            <p>
                FURNITURE MARKETPLACE
            </p>

        </div>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- ================================
         MAIN
         ================================ -->

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-header">

                <p class="eyebrow">
                    SELLER PORTAL
                </p>

                <h2>
                    Create Seller <span>Account</span>
                </h2>

                <p>
                    Create an account to start selling furniture
                    on SUGA MART.
                </p>

            </div>


            <!-- CREATE ACCOUNT FORM -->

            <form
                id="sellerCreateAccountForm"
                class="auth-form"
            >

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="sellerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="sellerName"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="sellerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="sellerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="sellerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="sellerPhone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group password-field">

                    <label for="sellerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="sellerPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <label class="show-password">

                        <input
                            type="checkbox"
                            id="showSellerPassword"
                        >

                        <span>
                            Show Password
                        </span>

                    </label>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group password-field">

                    <label for="sellerConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="sellerConfirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <label class="show-password">

                        <input
                            type="checkbox"
                            id="showSellerConfirmPassword"
                        >

                        <span>
                            Show Password
                        </span>

                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>

            </form>


            <!-- MESSAGE -->

            <p
                id="sellerCreateAccountMessage"
                class="form-message"
            ></p>


            <!-- LOGIN LINK -->

            <div class="auth-footer-text">

                <p>
                    Already have a seller account?
                </p>

                <a href="seller-login.html">
                    Login
                </a>

            </div>


            <!-- BACK -->

            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer class="site-footer">

        <p>
            &copy; 2026 SUGA MART
            <span>·</span>
            Furniture Marketplace
        </p>

    </footer>


    <!-- SHOW / HIDE PASSWORD -->

    <script>

        const showSellerPassword =
            document.getElementById("showSellerPassword");

        const sellerPassword =
            document.getElementById("sellerPassword");


        showSellerPassword.addEventListener("change", function () {

            if (this.checked) {

                sellerPassword.type = "text";

            } else {

                sellerPassword.type = "password";

            }

        });


        const showSellerConfirmPassword =
            document.getElementById("showSellerConfirmPassword");

        const sellerConfirmPassword =
            document.getElementById("sellerConfirmPassword");


        showSellerConfirmPassword.addEventListener("change", function () {

            if (this.checked) {

                sellerConfirmPassword.type = "text";

            } else {

                sellerConfirmPassword.type = "password";

            }

        });

    </script>


    <script src="script.js"></script>

</body>
</html>
